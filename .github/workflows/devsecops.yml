name: devsecops

on:
  push:
    branches: [master]

permissions:
  contents: read
  checks: write

jobs:
  code-lint:
    uses: './.github/workflows/code-lint.yml'

  code-scan:
    uses: './.github/workflows/code-security.yml'

  dependency-scan:
    uses: './.github/workflows/dependency.yml'

  sbom-generate:
    uses: './.github/workflows/sbom.yml'
