name: code-lint

on:
  workflow_call:

jobs:
  code-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [client, server]
    steps:
      - name: checkout-code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm install eslint prettier

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: true
          eslint_dir: ${{ matrix.folder }}
