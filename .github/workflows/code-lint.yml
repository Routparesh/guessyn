name: code-lint

on:
  workflow_call:

jobs:
  code-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [client, server]
    steps:
      - name: checkout-code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci
        working-directory: ${{ matrix.folder }}

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: true
          eslint_dir: ${{ matrix.folder }}
          prettier_dir: ${{ matrix.folder }}
          eslint_args: '--config ${{ matrix.folder }}/eslint.config.js'
